<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e63b2e">
  <title>Кто выгуливает Бориса</title>
  <style>
    :root {
      color-scheme: light;
      --red: #e63b2e;
      --red-dark: #bd291f;
      --yellow: #ffd84d;
      --ink: #171717;
      --muted: #716f6b;
      --paper: #fffdf8;
      --line: #e8e3d9;
      --green: #2f7048;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(ellipse at 88% 18%, rgb(255 216 77 / 20%), transparent 26rem),
        var(--paper);
    }

    button, input { font: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #3478f6;
      outline-offset: 3px;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: rgb(255 253 248 / 92%);
    }

    .topbar-inner, main, footer {
      width: min(1120px, calc(100% - 48px));
      margin-inline: auto;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: var(--red);
      font-size: 17px;
    }

    main { padding-block: 42px 64px; }

    .hero {
      min-height: 310px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      overflow: hidden;
      position: relative;
      border-radius: 26px;
      background: var(--yellow);
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      padding: 44px 0 44px 52px;
    }

    .eyebrow {
      margin: 0 0 15px;
      color: #51451c;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 570px;
      margin: 0;
      font-size: clamp(38px, 5.2vw, 66px);
      line-height: .98;
      letter-spacing: -.065em;
    }

    .hero-date {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 9px 13px;
      border: 1px solid rgb(23 23 23 / 18%);
      border-radius: 999px;
      background: rgb(255 253 248 / 60%);
      font-size: 14px;
      font-weight: 650;
    }

    .hero-art {
      align-self: stretch;
      display: grid;
      place-items: center;
      position: relative;
      padding: 15px 20px 10px 0;
    }

    .dog-illustration {
      display: block;
      width: min(100%, 340px);
      height: auto;
      filter: drop-shadow(0 16px 12px rgb(94 54 11 / 15%));
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 42px 0 18px;
    }

    h2 {
      margin: 0;
      font-size: clamp(25px, 3vw, 34px);
      letter-spacing: -.045em;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .slot {
      min-height: 198px;
      display: flex;
      flex-direction: column;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 4px 14px rgb(28 24 16 / 3%);
    }

    .slot-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .slot-time {
      font-size: 24px;
      font-weight: 780;
      letter-spacing: -.05em;
    }

    .slot-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .slot-state::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .slot-owner {
      min-height: 34px;
      margin: 12px 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .slot-form {
      display: grid;
      gap: 8px;
      margin-top: auto;
    }

    .slot-input {
      width: 100%;
      min-width: 0;
      padding: 10px 10px;
      border: 1px solid #dcd7ce;
      border-radius: 9px;
      background: #fff;
      font-size: 12px;
    }

    .slot-input::placeholder { color: #92908a; }

    .book-button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: var(--red);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      transition: background .15s ease, transform .15s ease;
    }

    .book-button:hover:not(:disabled) {
      background: var(--red-dark);
      transform: translateY(-1px);
    }

    .book-button:disabled {
      color: #77736b;
      background: #efede8;
      cursor: not-allowed;
    }

    .slot.is-booked {
      border-color: #e4d4d0;
      background: #fffaf8;
    }

    .slot.is-booked .slot-state { color: var(--red-dark); }
    .slot.is-booked .slot-owner { color: var(--ink); }

    .feeding {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 22px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }

    .feeding-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 730;
    }

    .feeding-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #fff3c2;
      font-size: 19px;
    }

    .feeding-meta {
      color: var(--muted);
      font-size: 14px;
      text-align: right;
    }

    .feeding-meta strong {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
      font-size: 15px;
    }

    .notice {
      min-height: 22px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .notice[data-kind="error"] { color: var(--red-dark); }
    .notice[data-kind="success"] { color: var(--green); }

    footer {
      padding-block: 0 28px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .slots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .hero-copy { padding-left: 34px; }
      .hero { min-height: 280px; }
    }

    @media (max-width: 600px) {
      .topbar { height: 62px; }
      .topbar-inner, main, footer { width: min(100% - 32px, 480px); }
      main { padding-top: 22px; }
      .hero {
        min-height: auto;
        grid-template-columns: 1fr;
      }
      .hero-copy { padding: 30px 24px 0; }
      h1 { max-width: 420px; font-size: clamp(40px, 12vw, 58px); }
      .hero-art { height: 190px; padding: 0 15px; }
      .dog-illustration { width: 230px; }
      .section-heading {
        align-items: start;
        flex-direction: column;
        gap: 7px;
        margin-top: 32px;
      }
      .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .slot { min-height: 187px; padding: 13px; }
      .slot-time { font-size: 22px; }
      .slot-state { font-size: 10px; }
      .feeding { align-items: start; padding: 15px; }
      .feeding-label { gap: 9px; font-size: 14px; }
      .feeding-meta { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand-mark" aria-hidden="true">Б</span>
      <span>Кто выгуливает Бориса</span>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">План на сегодня</p>
        <h1 id="page-title">Борис ждёт прогулку</h1>
        <p class="hero-date"><span aria-hidden="true">◷</span><time id="today">Загружаем дату…</time></p>
      </div>
      <div class="hero-art">
        <img class="dog-illustration" src="./assets/corgi.png" alt="Прогулка с корги у колоннады" width="768" height="1024">
      </div>
    </section>

    <section aria-labelledby="walks-title">
      <div class="section-heading">
        <h2 id="walks-title">Кто идёт гулять?</h2>
        <p class="section-note">Выберите свободное время и оставьте ФИО</p>
      </div>
      <div id="slots" class="slots" aria-live="polite" aria-busy="true"></div>
      <p id="notice" class="notice" role="status" aria-live="polite">Подключаемся к расписанию…</p>
    </section>

    <aside class="feeding" aria-label="Последнее кормление Бориса">
      <div class="feeding-label">
        <span class="feeding-icon" aria-hidden="true">🍽</span>
        <span>Последнее кормление</span>
      </div>
      <div id="feeding-info" class="feeding-meta">Загружаем информацию…</div>
    </aside>
  </main>

  <footer>Запись общая для всех, кто открыл расписание.</footer>

  <script>
    "use strict";

    // Node API: GET /api/state returns {date, slots, lastFeeding}; POST /api/bookings returns 409 for an occupied slot.
    const slotsElement = document.querySelector("#slots");
    const dateElement = document.querySelector("#today");
    const noticeElement = document.querySelector("#notice");
    const feedingElement = document.querySelector("#feeding-info");

    function setNotice(message, kind = "") {
      noticeElement.textContent = message;
      noticeElement.dataset.kind = kind;
    }

    function formatDate(dateString) {
      const date = new Date(`${dateString}T12:00:00`);
      if (Number.isNaN(date.getTime())) {
        throw new Error("Сервер вернул некорректную дату.");
      }
      return new Intl.DateTimeFormat("ru-RU", {
        weekday: "long",
        day: "numeric",
        month: "long"
      }).format(date);
    }

    function renderFeeding(feeding) {
      if (!feeding || typeof feeding.time !== "string" || typeof feeding.fullName !== "string") {
        throw new Error("Не удалось загрузить данные о последнем кормлении.");
      }
      feedingElement.replaceChildren();
      const time = document.createElement("strong");
      time.textContent = feeding.time;
      const person = document.createElement("span");
      person.textContent = feeding.fullName;
      feedingElement.append(time, person);
    }

    function renderSlots(slots) {
      if (!Array.isArray(slots) || slots.length !== 5) {
        throw new Error("Расписание должно содержать ровно пять слотов.");
      }

      slotsElement.replaceChildren();
      for (const slot of slots) {
        if (!slot || typeof slot.id !== "string" || typeof slot.time !== "string") {
          throw new Error("Сервер вернул некорректный слот.");
        }

        const booked = typeof slot.fullName === "string" && slot.fullName.length > 0;
        const card = document.createElement("article");
        card.className = `slot${booked ? " is-booked" : ""}`;

        const top = document.createElement("div");
        top.className = "slot-top";
        const time = document.createElement("time");
        time.className = "slot-time";
        time.textContent = slot.time;
        const state = document.createElement("span");
        state.className = "slot-state";
        state.textContent = booked ? "Занято" : "Свободно";
        top.append(time, state);

        const owner = document.createElement("p");
        owner.className = "slot-owner";
        owner.textContent = booked ? slot.fullName : "Здесь может быть ваше имя";
        card.append(top, owner);

        if (!booked) {
          const form = document.createElement("form");
          form.className = "slot-form";
          const input = document.createElement("input");
          input.className = "slot-input";
          input.type = "text";
          input.name = "fullName";
          input.autocomplete = "name";
          input.maxLength = 100;
          input.required = true;
          input.placeholder = "Ваше ФИО";
          input.setAttribute("aria-label", `ФИО для слота ${slot.time}`);

          const button = document.createElement("button");
          button.className = "book-button";
          button.type = "submit";
          button.textContent = "Записаться";
          form.append(input, button);
          form.addEventListener("submit", (event) => bookSlot(event, slot.id, input, button));
          card.append(form);
        }

        slotsElement.append(card);
      }
    }

    async function readResponse(response) {
      if (!response.ok) {
        const error = new Error("Не удалось связаться с расписанием.");
        error.status = response.status;
        throw error;
      }
      return response.json();
    }

    async function loadSchedule() {
      slotsElement.setAttribute("aria-busy", "true");
      try {
        const response = await fetch("/api/state", {
          headers: { Accept: "application/json" }
        });
        const state = await readResponse(response);
        dateElement.textContent = formatDate(state.date);
        renderSlots(state.slots);
        renderFeeding(state.lastFeeding);
        setNotice("Расписание обновлено.");
      } catch (error) {
        setNotice(error.message || "Не удалось загрузить расписание.", "error");
        if (feedingElement.textContent === "Загружаем информацию…") {
          feedingElement.textContent = "Нет соединения с сервером";
        }
      } finally {
        slotsElement.setAttribute("aria-busy", "false");
      }
    }

    async function bookSlot(event, slotId, input, button) {
      event.preventDefault();
      const fullName = input.value.trim();
      if (!fullName) {
        input.focus();
        return;
      }

      button.disabled = true;
      setNotice("Записываем на прогулку…");
      try {
        const response = await fetch("/api/bookings", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify({ slotId, fullName })
        });

        if (response.status === 409) {
          setNotice("Этот слот уже заняли. Обновляем расписание.", "error");
          await loadSchedule();
          return;
        }
        await readResponse(response);
        setNotice("Готово! Вы записаны на прогулку.", "success");
        await loadSchedule();
      } catch (error) {
        button.disabled = false;
        setNotice(error.message || "Не удалось сохранить запись. Попробуйте ещё раз.", "error");
      }
    }

    loadSchedule();
  </script>
</body>
</html>
